name: Release

# Triggered by pushing a core release tag, e.g.
#     git tag pympacds@v0.3.2 && git push origin pympacds@v0.3.2
#
# On a tag this builds the sdist/wheel, attaches them to a DRAFT GitHub Release
# (reviewed and published by a maintainer), and — when enabled — publishes to
# PyPI. Automated PyPI publishing is intentionally DISABLED (manual control
# retained). To enable it later:
#   1. uncomment `id-token: write` under `permissions`
#   2. uncomment the `environment:` block and the `Publish to PyPI` step below
#   3. configure a PyPI Trusted Publisher for project `pympacds`
#      (owner dargor0, repo pympacds, workflow release.yml, environment pypi)
on:
  push:
    tags:
      - "pympacds@v*"

permissions:
  contents: write    # create the draft GitHub Release
  # id-token: write  # required for PyPI Trusted Publishing

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    # environment:
    #   name: pypi
    #   url: https://pypi.org/p/pympacds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="pympacds ${GITHUB_REF_NAME#pympacds@}"
          notes=$(awk '
            /^pympacds \(/ { inblock = 1; next }
            inblock && /^ -- / { exit }
            inblock { sub(/^  \* /, "- "); print }
          ' debian/changelog)
          gh release create "${GITHUB_REF_NAME}" --draft \
            --title "$title" --notes "$notes" dist/*
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
