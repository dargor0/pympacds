# Example configuration for the sensor example service.

[DEFAULT]
# Log level: DEBUG, INFO, WARN, ERROR
loglevel = INFO
# Log to stderr (captured by systemd/journald). true/false.
logstdout = true

[dbus]
# Bus namespace shared by all services of this system
bus_prefix = org.pympacds.test
# Automatically discover peer services (friend bus)
discovery_enabled = true

[sensor]
# Seconds between emitted measurements
period_s = 2
