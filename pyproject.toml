[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pympacds"
version = "0.3.2"
description = "Python Multi Process Asyncio-based Cooperative Discoverable Services Framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name="Oscar Diaz", email="odiaz@ieee.org"}
]
keywords = ["dbus", "asyncio", "daemon", "framework", "embedded", "ipc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/dargor0/pympacds"
Repository = "https://github.com/dargor0/pympacds"
Issues = "https://github.com/dargor0/pympacds/issues"
Changelog = "https://github.com/dargor0/pympacds/releases"
Documentation = "https://github.com/dargor0/pympacds/tree/main/doc"

[project.scripts]
pympacds-admin = "pympacds.cli:main"

[project.optional-dependencies]
dbus-fast = ["dbus-fast>=4.0"]
dbus-next = ["dbus-next>=0.2"]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "mypy", "ruff", "lizard"]
docs = ["sphinx>=7.0", "myst-parser>=2.0", "furo>=2023.9.10"]

[project.entry-points."pympacds.middleware"]
httpconfprov = "pympacds.middleware:HttpConfigMiddleware"
signal_action = "pympacds.signal_action:SignalActionMiddleware"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-v",
    "--tb=short",
    "--cov=pympacds",
    "--cov-report=term-missing",
]
filterwarnings = [
    # Third-party deprecation from PyGObject (only present when `gi` is
    # installed). Matched by message only, so pytest does not try to import the
    # `gi` module (which would emit a PytestConfigWarning when it is absent).
    "ignore:GLib.unix_signal_add_full is deprecated.*",
]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# D-Bus type-signature string annotations ("s", "b", "as", ...) are the
# dbus-fast/dbus-next convention, not Python type references.
[tool.ruff.lint.per-file-ignores]
"src/pympacds/builtin_contracts.py" = ["F821", "F722"]
"src/pympacds/signal_action.py" = ["F821", "F722"]
"examples/*.py" = ["F821", "F722"]
"tests/*.py" = ["F821", "F722"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

# D-Bus type-signature annotations ("s", "b", "as", ...) are the dbus-fast/dbus-next
# convention, not Python types; mypy tries to resolve them as forward references.
[[tool.mypy.overrides]]
module = "pympacds.builtin_contracts"
disable_error_code = ["name-defined", "valid-type"]

# The base class is resolved dynamically from the D-Bus library, so its type is
# not known statically (dynamic base class).
[[tool.mypy.overrides]]
module = "pympacds.contracts"
disable_error_code = ["valid-type", "misc"]

[[tool.mypy.overrides]]
module = "pympacds.signal_action"
disable_error_code = ["name-defined", "valid-type"]
