[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pympacds-mqtt"
version = "0.1.1"
description = "MQTT client service for pympacds"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name="Oscar Diaz", email="odiaz@ieee.org"}
]
dependencies = [
    "pympacds>=0.2.0",
    "paho-mqtt>=2.0",
]

[project.scripts]
pympacds-mqtt = "pympacds_mqtt.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "../../src"]
addopts = [
    "-v",
    "--tb=short",
    "--cov=pympacds_mqtt",
    "--cov-report=term-missing",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# D-Bus type-signature string annotations ("s", "b", "ss", ...) are the
# dbus-fast/dbus-next convention, not Python type references.
[tool.ruff.lint.per-file-ignores]
"src/pympacds_mqtt/contracts.py" = ["F821", "F722"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
mypy_path = ["../../src"]

# The core framework has its own (pre-existing) typing debt ("object"-typed
# D-Bus globals, D-Bus signature strings).  Treat it as Any rather than
# re-checking it from the service.
[[tool.mypy.overrides]]
module = "pympacds"
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "pympacds.*"
follow_imports = "silent"

# D-Bus type-signature annotations ("s", "b", "ss", ...) are the dbus-fast/dbus-next
# convention, not Python types; mypy tries to resolve them as forward references.
[[tool.mypy.overrides]]
module = "pympacds_mqtt.contracts"
disable_error_code = ["name-defined", "valid-type"]
